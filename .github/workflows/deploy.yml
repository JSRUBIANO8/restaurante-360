name: Restaurante 360 CI-CD
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Build / dependencias
        run: |
          python -m pip install -r requirements-dev.txt
          mkdir -p reports
          python -m compileall -q app.py
      - name: Pruebas y cobertura
        run: python -m pytest -q --cov=app --cov-fail-under=80 --cov-report=term --cov-report=xml:reports/coverage.xml --junitxml=reports/tests.xml
      - name: Seguridad del codigo
        run: bandit -r app.py -ll -f json -o reports/bandit.json
      - name: Vulnerabilidades de dependencias de produccion
        run: pip-audit -r requirements.txt -f json -o reports/audit.json
      - name: Guardar evidencias de calidad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calidad
          path: reports/
  staging:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Construir imagen Docker
        run: docker build -t restaurante-360:${{ github.sha }} .
      - name: Desplegar staging temporal
        run: |
          docker run -d --name restaurante -p 127.0.0.1:8000:8000 restaurante-360:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs restaurante
          exit 1
      - name: Prueba de carga y umbral de rendimiento
        run: |
          mkdir -p reports
          python -m pip install -r requirements-dev.txt
          locust -f locustfile.py --headless -u 50 -r 10 -t 30s --host http://localhost:8000 --csv reports/load --exit-code-on-error 1
          python check_load.py
      - name: Evidencias y limpieza
        if: always()
        run: |
          mkdir -p reports
          docker logs restaurante > reports/container.log 2>&1 || true
          docker rm -f restaurante || true
      - name: Guardar evidencias de staging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging
          path: reports/
